<!-- Shared styles for the themed Research, Talks, Blog and Working Projects pages -->
<style>
  :root {
    --wl-accent: #52adc8;
    --wl-accent-dark: #2f7d94;
    --wl-ink: #494e52;
    --wl-muted: #7a8288;
    --wl-line: #e6e8ea;
    --wl-surface: #fafbfc;
  }

  /* ---------- shared ---------- */
  .wl-intro {
    font-size: 0.95em;
    color: var(--wl-muted);
    margin: 0 0 1.75em;
    max-width: 46em;
  }
  .wl-intro a { color: var(--wl-accent-dark); }

  .wl-tag {
    display: inline-block;
    font-size: 0.68em;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--wl-muted);
    border: 1px solid var(--wl-line);
    border-radius: 2em;
    padding: 0.15em 0.7em;
    white-space: nowrap;
  }

  .wl-links {
    margin-top: 0.5em;
    font-size: 0.78em;
    letter-spacing: 0.02em;
  }
  .wl-links a {
    display: inline-block;
    margin-right: 1em;
    color: var(--wl-accent-dark);
    text-decoration: none;
    border-bottom: 1px solid rgba(82, 173, 200, 0.4);
  }
  .wl-links a:hover { border-bottom-color: var(--wl-accent-dark); }

  /* ---------- research themes ---------- */
  .wl-theme {
    border-top: 1px solid var(--wl-line);
    padding: 1.5em 0 0.5em;
    margin: 0;
  }
  .wl-theme[open] { padding-bottom: 1.25em; }
  .wl-theme > summary {
    list-style: none;
    cursor: pointer;
    display: block;
    outline: none;
  }
  .wl-theme > summary::-webkit-details-marker { display: none; }

  .wl-theme-head {
    display: flex;
    gap: 1.5em;
    align-items: center;
  }
  .wl-theme-thumb {
    flex: 0 0 40%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--wl-line);
    border-radius: 3px;
    overflow: hidden;
  }
  .wl-theme-thumb img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
  }
  .wl-theme-copy { flex: 1 1 auto; min-width: 0; }
  .wl-theme-title {
    font-size: 1.12em;
    font-weight: 700;
    line-height: 1.3;
    color: var(--wl-ink);
    margin: 0 0 0.3em;
  }
  .wl-theme-title .wl-chev {
    color: var(--wl-accent);
    font-weight: 400;
    margin-left: 0.35em;
    display: inline-block;
    transition: transform 0.15s ease;
  }
  .wl-theme[open] .wl-chev { transform: rotate(90deg); }
  .wl-theme > summary:hover .wl-theme-title { color: var(--wl-accent-dark); }
  .wl-theme-blurb {
    font-size: 0.86em;
    color: var(--wl-muted);
    line-height: 1.55;
    margin: 0 0 0.5em;
  }
  .wl-theme-count {
    font-size: 0.72em;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--wl-muted);
  }

  /* ---------- paper rows ---------- */
  .wl-papers {
    list-style: none;
    margin: 1.5em 0 0;
    padding: 0 0 0 1.25em;
    border-left: 2px solid var(--wl-line);
  }
  .wl-paper {
    display: flex;
    gap: 1em;
    padding: 0.9em 0;
    border-top: 1px dotted var(--wl-line);
  }
  .wl-paper:first-child { border-top: none; padding-top: 0.2em; }
  .wl-paper-thumb {
    flex: 0 0 160px;
    width: 160px;
    height: 116px;
    background: #fff;
    border: 1px solid var(--wl-line);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wl-paper-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    margin: 0;
  }
  .wl-paper-body { flex: 1 1 auto; min-width: 0; }
  .wl-paper-title {
    font-size: 0.97em;
    font-weight: 600;
    line-height: 1.38;
    margin: 0 0 0.25em;
  }
  .wl-paper-title a {
    color: var(--wl-ink);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .wl-paper-title a:hover {
    color: var(--wl-accent-dark);
    border-bottom-color: var(--wl-accent);
  }
  .wl-paper-venue {
    font-size: 0.8em;
    color: var(--wl-muted);
    margin: 0 0 0.4em;
  }
  .wl-paper-venue em { font-style: italic; }
  .wl-paper-summary {
    font-size: 0.85em;
    line-height: 1.6;
    color: var(--wl-ink);
    margin: 0 0 0.45em;
  }
  .wl-cite {
    font-size: 0.76em;
    line-height: 1.5;
    color: var(--wl-muted);
    margin: 0;
    padding-left: 0.85em;
    border-left: 2px solid var(--wl-line);
  }

  /* ---------- talks ---------- */
  .wl-year {
    font-size: 0.78em;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--wl-muted);
    border-bottom: 1px solid var(--wl-line);
    padding-bottom: 0.35em;
    margin: 2em 0 0.9em;
  }
  .wl-year:first-of-type { margin-top: 0.5em; }
  .wl-talks { list-style: none; margin: 0; padding: 0; }
  .wl-talk {
    padding: 0.62em 0;
    border-bottom: 1px dotted var(--wl-line);
    font-size: 0.9em;
    line-height: 1.5;
  }
  .wl-talk-title {
    font-weight: 600;
    color: var(--wl-ink);
  }
  .wl-talk-title a {
    color: var(--wl-ink);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .wl-talk-title a:hover { color: var(--wl-accent-dark); border-bottom-color: var(--wl-accent); }
  .wl-talk-meta {
    display: block;
    font-size: 0.86em;
    color: var(--wl-muted);
    margin-top: 0.12em;
  }
  .wl-talk-meta em { font-style: italic; }
  .wl-slides {
    font-size: 0.85em;
    color: var(--wl-accent-dark);
    text-decoration: none;
    white-space: nowrap;
    margin-left: 0.5em;
    border-bottom: 1px solid rgba(82, 173, 200, 0.4);
  }

  /* ---------- blog ---------- */
  .wl-post {
    display: flex;
    gap: 1.25em;
    padding: 1.25em 0;
    border-top: 1px solid var(--wl-line);
  }
  .wl-post:first-of-type { border-top: none; }
  .wl-post-thumb {
    flex: 0 0 170px;
    width: 170px;
    height: 112px;
    border: 1px solid var(--wl-line);
    border-radius: 3px;
    overflow: hidden;
    background: #fff;
  }
  .wl-post-thumb img { width: 100%; height: 100%; object-fit: cover; margin: 0; }
  .wl-post-body { flex: 1 1 auto; min-width: 0; }
  .wl-post-title {
    font-size: 1.02em;
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 0.3em;
  }
  .wl-post-title a { color: var(--wl-ink); text-decoration: none; border-bottom: 1px solid transparent; }
  .wl-post-title a:hover { color: var(--wl-accent-dark); border-bottom-color: var(--wl-accent); }
  .wl-post-meta { font-size: 0.78em; color: var(--wl-muted); margin: 0 0 0.45em; }
  .wl-post-excerpt { font-size: 0.87em; line-height: 1.6; margin: 0; }

  /* ---------- working projects ---------- */
  .wl-proj {
    display: flex;
    gap: 1.35em;
    padding: 1.5em 0;
    border-top: 1px solid var(--wl-line);
  }
  .wl-proj:first-of-type { border-top: none; padding-top: 0.5em; }
  .wl-proj-thumb {
    flex: 0 0 230px;
    width: 230px;
    background: #fff;
    border: 1px solid var(--wl-line);
    border-radius: 3px;
    overflow: hidden;
    align-self: flex-start;
  }
  .wl-proj-thumb img { width: 100%; height: auto; display: block; margin: 0; }
  .wl-proj-body { flex: 1 1 auto; min-width: 0; }
  .wl-proj-title {
    font-size: 1.02em;
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 0.35em;
  }
  .wl-proj-title a { color: var(--wl-ink); text-decoration: none; border-bottom: 1px solid transparent; }
  .wl-proj-title a:hover { color: var(--wl-accent-dark); border-bottom-color: var(--wl-accent); }
  .wl-proj-meta { font-size: 0.78em; color: var(--wl-muted); margin: 0 0 0.5em; }
  .wl-proj-summary { font-size: 0.87em; line-height: 1.62; margin: 0; }

  /* ---------- single-item pages ---------- */
  .wl-figure { margin: 1.25em 0 1.75em; }
  .wl-figure img { display: block; width: 100%; height: auto; border: 1px solid var(--wl-line); border-radius: 3px; }
  .wl-figure figcaption { font-size: 0.78em; color: var(--wl-muted); margin-top: 0.5em; line-height: 1.5; }
  .wl-embed {
    width: 100%;
    height: 620px;
    border: 1px solid var(--wl-line);
    border-radius: 3px;
    background: #fff;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 768px) {
    .wl-theme-head { flex-direction: column; align-items: stretch; gap: 0.9em; }
    .wl-theme-thumb { flex-basis: auto; max-width: none; width: 100%; }
    .wl-papers { padding-left: 0.85em; }
    .wl-paper-thumb { flex-basis: 104px; width: 104px; height: 76px; }
    .wl-post, .wl-proj { flex-direction: column; gap: 0.85em; }
    .wl-post-thumb, .wl-proj-thumb { width: 100%; flex-basis: auto; height: auto; }
    .wl-post-thumb { height: 170px; }
    .wl-embed { height: 460px; }
  }
</style>
