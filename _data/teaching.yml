# Courses taught. `group` is either "instructor" or "ta"; entries render in
# the order they appear here (most recent first within each group).
instructor:
  - term: "Spring 2025"
    code: "CRP 1200"
    name: "Introduction to Statistics for Urban Studies"
    role: "Instructor"
    level: "Undergraduate (core method)"
    enrollment: "42 students"
    institution: "City and Regional Planning, Cornell University"
    format: "Lecture"
    repo: "https://github.com/wenzhengli-etal/IntroStatas_1200"
    page: /teaching/Spring2025-intro-Statas/
    description: "Introduces descriptive and inferential statistics for understanding places and human well-being. The course emphasizes using statistics to interpret the world, evaluate policy, and support forecasting, while helping students connect theory to empirical analysis. Students work in Excel, R, and Stata as complementary tools, with major publicly available datasets commonly used in urban studies."

  - term: "Spring 2025"
    code: "CRP/DESGN 4680/5680"
    name: "Introduction to Urban Data Science"
    role: "Instructor"
    level: "Undergraduate / graduate (Master's core method)"
    enrollment: "31 students"
    institution: "City and Regional Planning, Cornell University"
    format: "Lecture and lab"
    repo: "https://github.com/wenzhengli-etal/UrbanDataScience_4680_5680"
    page: /teaching/spring2025-intro-urban-data-science/
    description: "Introduces data analysis, coding, statistics, visualization, and generative AI for urban and spatial research. Using open-source data and Python, students learn to formulate research questions, prepare data, apply analytical methods, and present findings. The course also introduces emerging AI and LLMs for the analysis of cities, society, and the environment."

  - term: "Fall 2024"
    code: "CRP 4080"
    name: "Introduction to GIS for Urban Studies"
    role: "Instructor"
    level: "Undergraduate (core method)"
    enrollment: "30 students"
    institution: "City and Regional Planning, Cornell University"
    format: "Lecture and lab"
    repo: "https://github.com/wenzhengli-etal/IntroGIS_4080_5080"
    page: /teaching/Fall2024-intro-GIS/
    description: "Covers foundational GIS concepts and skills, including mapping, projection, geoprocessing, data acquisition, and basic network and raster analysis. For introductory students, the course emphasizes spatial reasoning and critical thinking, with attention to social and environmental justice issues."

  - term: "Fall 2024"
    code: "CRP 2100"
    name: "Neighborhood Change in the City: Quantitative Methods"
    role: "Co-instructor, with Prof. Wenfei Xu"
    level: "Undergraduate (core method II)"
    enrollment: "42 students"
    institution: "City and Regional Planning, Cornell University"
    format: "Lecture and lab"
    description: "Introduces undergraduate students to empirical quantitative research in urban studies. The course links debates on housing, neighborhood change, and urban inequality to applied quantitative methods, and covers basic econometric concepts such as sampling, treatment and control groups, and introductory ideas from quasi-experimental approaches, including difference-in-differences, panel fixed effects, and spatial regression."

  - term: "Fall 2024"
    code: "CRP 3280/4280"
    name: "Mapping and Counter-mapping"
    role: "Co-instructor, with Prof. Wenfei Xu"
    level: "Graduate"
    enrollment: "12 students"
    institution: "City and Regional Planning, Cornell University"
    format: "Lecture and lab"
    repo: "https://github.com/wenzhengli-etal/WebGIS_Countermapping_4280_5280"
    page: /teaching/spring2025-WebGIS-Countermapping/
    description: "Combines lecture and discussion with lab sessions. Lectures take up the debates and practices of critical cartography and digital geography, with an emphasis on the ethos of countermapping to amplify underrepresented perspectives. In the labs, students critically analyze existing maps and develop their own narrative maps and countermaps using QGIS, Mapbox, JavaScript, and HTML."

  - term: "Summer 2024"
    code: "CRP 3850/5850"
    name: "Urban Spatial Data Analytics"
    role: "Instructor"
    level: "Undergraduate"
    enrollment: "6 students"
    institution: "City and Regional Planning, Cornell University"
    format: "Lecture and lab"
    repo: "https://github.com/wenzhengli-etal/CRP3850_summer"
    description: "A summer-school course introducing basic data analytical skills, both spatial and aspatial. Combining lectures and labs, students gain the theory and reasoning of spatial statistics alongside hands-on experience using programming to carry out analytical tasks — from proposing ideas and preparing and cleaning data through analysis, poster-making, and presentation."

