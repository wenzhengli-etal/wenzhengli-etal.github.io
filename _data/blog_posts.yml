# Public writing published elsewhere. Newest first.
- title: "Why the Number of Local Governments Shapes the Parks We Build"
  outlet: "Urban Affairs Review"
  date: 2026-09-14
  url: "https://www.urbanaffairsreview.com/uar-archive/number-of-local-governments-shapes-parks"
  image: /images/UAR_openspace.jpg
  authors: "With Stephan Schmidt"
  excerpt: "A short piece for Urban Affairs Review on what municipal fragmentation does to metropolitan open space. More local governments means more small neighborhood parks within a 10-minute walk of where people live &mdash; and fewer of the large, regionally significant ones that no single jurisdiction has an incentive to protect. Fragmentation doesn't simply change how much open space exists; it changes what kind of open space cities produce."
