- title: "Why the Number of Local Governments Shapes the Parks We Build"
  outlet: "Urban Affairs Review"
  kind: "Commentary"
  date: 2026-09-14
  url: "https://www.urbanaffairsreview.com/uar-archive/number-of-local-governments-shapes-parks"
  image: /images/UAR_openspace.jpg
  authors: "With Stephan Schmidt"
  paper: /research/2026-02-20-paper-title-number-9/
  excerpt: "A short piece for Urban Affairs Review on what municipal fragmentation does to metropolitan open space. More local governments means more small neighborhood parks within a 10-minute walk of where people live &mdash; and fewer of the large, regionally significant ones that no single jurisdiction has an incentive to protect."

- title: "Multiple city hubs, dispersed parks keep metro areas cooler"
  outlet: "Cornell Chronicle"
  kind: "News coverage"
  date: 2024-02-07
  url: "https://news.cornell.edu/stories/2024/02/multiple-city-hubs-dispersed-parks-keep-metro-areas-cooler"
  image: /images/research/theme-environment-v2.jpg
  authors: "By James Dean"
  paper: /research/2024-02-17-paper-title-number-4/
  excerpt: "Cornell Chronicle feature on our study of 50 German metropolitan regions: city regions with several centers and scattered green space run cooler than single-hub ones, and many small parks do more to cool a region than one large park &mdash; &ldquo;multiple smaller green spaces are able to more effectively reduce and break up contiguous urban areas.&rdquo;"

- title: "多中心城市发展能否同时实现经济增长和区域公平？德国地区的多尺度分析"
  outlet: "WeChat"
